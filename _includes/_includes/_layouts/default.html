<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic Metadata & SEO -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph / Social Media SEO -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <!-- CSS Styling -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #222; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #111; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header a.logo { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    nav a { color: #ccc; text-decoration: none; margin-left: 1.5rem; transition: color 0.2s; }
    nav a:hover { color: #fff; }
    main { flex: 1; max-width: 800px; width: 100%; margin: 2rem auto; padding: 0 1rem; }
    footer { background: #f4f4f4; border-top: 1px solid #ddd; text-align: center; padding: 1.5rem 1rem; color: #666; font-size: 0.9rem; }
    footer a { color: #444; text-decoration: none; }
  </style>
</head>
<body>

  <!-- Global Header -->
  <header>
    <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about' | relative_url }}">About</a>
    </nav>
  </header>

  <!-- Main Page Content -->
  <main>
    {{ content }}
  </main>

  <!-- Global Footer -->
  <footer>
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
  </footer>

</body>
</html>
